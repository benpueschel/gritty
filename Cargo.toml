[package]
name = "gritty"
version = "2.2.3"
edition = "2021"
description = "A command line tool to manage your remote repositories on GitHub, GitLab and Gitea remotes"
repository = "https://github.com/benpueschel/gritty"
authors = ["Ben Püschel"]
readme = "README.md"
license = "MIT"
categories = ["command-line-utilities"]
keywords = ["git", "github", "gitlab", "gitea", "cli"]

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dependencies]
async-trait = "0.1.91"
chrono = "0.4.45"
gitea-sdk = { version = "0.6.3" }
octocrab = "0.54.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "macros"] }
toml = "1.1.4"
keyring = { version = "4.1.6", optional = true }
rpassword = "7.5.4"
ansi_term = "0.12.1"
clap = { version = "4.6.5", features = [
	"derive",
	"deprecated",
	"color",
	"cargo",
] }
gitlab = "0.1902.0"
urlencoding = "2.1.3"
human-panic = "2.0.8"
clap_complete = "4.6.8"
http = "1.5.0"
